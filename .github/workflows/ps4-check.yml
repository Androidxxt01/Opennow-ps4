name: ps4-check
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld libjansson-dev unzip

      - name: OpenOrbis SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          echo "Assets da release:"
          gh release view -R $R --json assets -q '.assets[].name'
          mkdir -p /tmp/oo
          gh release download -R $R --pattern 'toolchain-llvm-18.tar.gz' --dir /tmp/oo
          cd /tmp/oo
          for f in *; do
            case "$f" in
              *.zip) unzip -q "$f" ;;
              *.tar.gz|*.tgz) tar xzf "$f" ;;
            esac
          done
          OO=$(find /tmp/oo -name errno.h -path '*include*' -print -quit | sed 's|/include/.*||')
          echo "OPENORBIS=$OO" >> "$GITHUB_ENV"
          echo "SDK em: $OO"
          if [ -z "$OO" ]; then
            echo "::error::OpenOrbis SDK nao encontrado: errno.h nao localizado"
            exit 1
          fi
          find "$OO" -maxdepth 2 | head -30

      - name: Isolar headers do Jansson
        run: |
          mkdir -p /tmp/jansson-inc && cp /usr/include/jansson.h /usr/include/x86_64-linux-gnu/jansson_config.h /tmp/jansson-inc/ 2>/dev/null || cp /usr/include/jansson_config.h /tmp/jansson-inc/
          ls -l /tmp/jansson-inc

      - name: Check de compilacao
        shell: bash
        run: |
          set -o pipefail
          make -k -f Makefile.ps4-check OPENORBIS="$OPENORBIS" JANSSON_INCLUDE=/tmp/jansson-inc 2>&1 | tee check.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-log
          path: check.log
