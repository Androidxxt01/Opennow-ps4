name: ps4-check
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld libjansson-dev unzip

      - name: OpenOrbis SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          echo "Assets da release:"
          gh release view -R $R --json assets -q '.assets[].name'
          mkdir -p /tmp/oo
          gh release download -R $R --pattern 'toolchain-llvm-18.tar.gz' --dir /tmp/oo
          cd /tmp/oo
          for f in *; do
            case "$f" in
              *.zip) unzip -q "$f" ;;
              *.tar.gz|*.tgz) tar xzf "$f" ;;
            esac
          done
          OO=$(find /tmp/oo -name errno.h -path '*include*' -print -quit | sed 's|/include/.*||')
          echo "OPENORBIS=$OO" >> "$GITHUB_ENV"
          echo "SDK em: $OO"
          if [ -z "$OO" ]; then
            echo "::error::OpenOrbis SDK nao encontrado: errno.h nao localizado"
            exit 1
          fi
          find "$OO" -maxdepth 2 | head -30

      - name: Achar libc++
        shell: bash
        run: |
          ATOMIC_FILE=$(find /tmp/oo -type f -name atomic -path '*c++*' | head -1)
          echo "Arquivo atomic encontrado: ${ATOMIC_FILE:-nenhum}"
          echo "Diretorios v1:"
          find /tmp/oo -type d -name 'v1' -path '*c++*' | head
          echo "Diretorios include:"
          find /tmp/oo -maxdepth 4 -type d -name 'include' | head -20
          if [ -z "$ATOMIC_FILE" ]; then
            echo "::error::libc++ ausente no toolchain"
            exit 1
          fi
          LIBCXX_INCLUDE=$(dirname "$ATOMIC_FILE")
          echo "LIBCXX_INCLUDE=$LIBCXX_INCLUDE" >> "$GITHUB_ENV"
          echo "LIBCXX_INCLUDE=$LIBCXX_INCLUDE"

      - name: Buscar RNG no SDK
        continue-on-error: true
        shell: bash
        run: |
          grep -rniE "random|entropy|getentropy" "$OPENORBIS/include" | cut -c1-200 | head -60
          find "$OPENORBIS/lib" -type f \( -name '*.a' -o -name '*.so' -o -name '*.sprx' \) | head -30
          for f in $(find "$OPENORBIS/lib" -type f -name '*.a' | head -20); do nm -g --defined-only "$f" 2>/dev/null | grep -iE "random|entropy|rand" ; done | head -60

      - name: Isolar headers do Jansson
        run: |
          mkdir -p /tmp/jansson-inc && cp /usr/include/jansson.h /usr/include/x86_64-linux-gnu/jansson_config.h /tmp/jansson-inc/ 2>/dev/null || cp /usr/include/jansson_config.h /tmp/jansson-inc/
          ls -l /tmp/jansson-inc

      - name: Check de compilacao
        shell: bash
        run: |
          set -o pipefail
          make -k -f Makefile.ps4-check OPENORBIS="$OPENORBIS" JANSSON_INCLUDE=/tmp/jansson-inc LIBCXX_INCLUDE="$LIBCXX_INCLUDE" 2>&1 | tee check.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-log
          path: check.log
