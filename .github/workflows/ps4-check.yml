name: ps4-check
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm unzip python3-jinja2 python3-jsonschema curl

      - name: Versao do linker
        run: |
          command -v ld.lld
          ld.lld --version

      - name: OpenOrbis SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=OpenOrbis/OpenOrbis-PS4-Toolchain
          echo "Assets da release:"
          gh release view -R $R --json assets -q '.assets[].name'
          mkdir -p /tmp/oo
          gh release download -R $R --pattern 'toolchain-llvm-18.tar.gz' --dir /tmp/oo
          cd /tmp/oo
          for f in *; do
            case "$f" in
              *.zip) unzip -q "$f" ;;
              *.tar.gz|*.tgz) tar xzf "$f" ;;
            esac
          done
          OO=$(find /tmp/oo -name errno.h -path '*include*' -print -quit | sed 's|/include/.*||')
          echo "OPENORBIS=$OO" >> "$GITHUB_ENV"
          echo "SDK em: $OO"
          if [ -z "$OO" ]; then
            echo "::error::OpenOrbis SDK nao encontrado: errno.h nao localizado"
            exit 1
          fi
          find "$OO" -maxdepth 2 | head -30

      - name: Achar libc++
        shell: bash
        run: |
          ATOMIC_FILE=$(find /tmp/oo -type f -name atomic -path '*c++*' | head -1)
          echo "Arquivo atomic encontrado: ${ATOMIC_FILE:-nenhum}"
          echo "Diretorios v1:"
          find /tmp/oo -type d -name 'v1' -path '*c++*' | head
          echo "Diretorios include:"
          find /tmp/oo -maxdepth 4 -type d -name 'include' | head -20
          if [ -z "$ATOMIC_FILE" ]; then
            echo "::error::libc++ ausente no toolchain"
            exit 1
          fi
          LIBCXX_INCLUDE=$(dirname "$ATOMIC_FILE")
          echo "LIBCXX_INCLUDE=$LIBCXX_INCLUDE" >> "$GITHUB_ENV"
          echo "LIBCXX_INCLUDE=$LIBCXX_INCLUDE"

      - name: Buscar RNG no SDK
        continue-on-error: true
        shell: bash
        run: |
          : > /tmp/rng_headers.txt
          : > /tmp/rng_random_h.txt
          : > /tmp/rng_net_h.txt
          : > /tmp/rng_libs.txt
          : > /tmp/rng_archives.txt
          : > /tmp/rng_syms.txt
          : > /tmp/rng_samples.txt
          : > /tmp/rng_usage.txt
          : > /tmp/rng_sysrandom.txt

          grep -rniE --include='*.h' --exclude-dir='c++' \
            "random|entropy|getentropy|arandom" \
            "$OPENORBIS/include" > /tmp/rng_headers.txt 2>&1 || true

          if [ -f "$OPENORBIS/include/orbis/Random.h" ]; then
            cat "$OPENORBIS/include/orbis/Random.h" > /tmp/rng_random_h.txt 2>&1 || true
          fi
          if [ -f "$OPENORBIS/include/orbis/Net.h" ]; then
            grep -n -B5 -A15 "sceNetGetRandom" "$OPENORBIS/include/orbis/Net.h" \
              > /tmp/rng_net_h.txt 2>&1 || true
          fi

          find "$OPENORBIS/lib" -type f > /tmp/rng_libs.txt 2>&1 || true
          find "$OPENORBIS/lib" -type f \( -name '*.a' -o -name '*.so' \) \
            > /tmp/rng_archives.txt 2>&1 || true

          while IFS= read -r f; do
            syms=$(nm -g --defined-only "$f" 2>/dev/null) || \
              syms=$(llvm-nm -g --defined-only "$f" 2>/dev/null) || syms=""
            hits=$(printf '%s\n' "$syms" | grep -iE "random|entropy|arandom" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "== $f ==" >> /tmp/rng_syms.txt
              printf '%s\n' "$hits" >> /tmp/rng_syms.txt
            fi
          done < /tmp/rng_archives.txt

          for d in "$OPENORBIS/samples" "$OPENORBIS/docs"; do
            if [ -d "$d" ]; then
              grep -rniE "sceRandom|GetRandomNumber|arc4random|getentropy|getrandom" "$d" \
                >> /tmp/rng_samples.txt 2>&1 || true
              grep -rn -B5 -A5 "sceRandomGetRandomNumber" "$d" \
                >> /tmp/rng_usage.txt 2>&1 || true
            fi
          done

          if [ -f "$OPENORBIS/include/sys/random.h" ]; then
            cat "$OPENORBIS/include/sys/random.h" > /tmp/rng_sysrandom.txt 2>&1 || true
            grep -nE "getrandom|getentropy" "$OPENORBIS/include/sys/random.h" \
              >> /tmp/rng_sysrandom.txt 2>&1 || true
          else
            echo "sys/random.h: ausente" > /tmp/rng_sysrandom.txt
          fi

          echo "=== HEADERS (60) ==="
          head -60 /tmp/rng_headers.txt
          echo "=== include/orbis/Random.h (completo) ==="
          cat /tmp/rng_random_h.txt
          echo "=== include/orbis/Net.h: sceNetGetRandom (60) ==="
          head -60 /tmp/rng_net_h.txt
          echo "=== LIBS (60) ==="
          head -60 /tmp/rng_libs.txt
          echo "=== SIMBOLOS (60) ==="
          head -60 /tmp/rng_syms.txt
          echo "=== SAMPLES/DOCS (80) ==="
          head -80 /tmp/rng_samples.txt
          echo "=== sceRandomGetRandomNumber com contexto (100) ==="
          head -100 /tmp/rng_usage.txt
          echo "=== sys/random.h (60) ==="
          head -60 /tmp/rng_sysrandom.txt

      - name: Baixar Jansson 2.11
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/akheron/jansson/releases/download/v2.11/jansson-2.11.tar.bz2"
          SHA256="783132e2fc970feefc2fa54199ef65ee020bd8e0e991a78ea44b8586353a0947"
          mkdir -p build/ps4-check/jansson
          curl -sL "$URL" -o /tmp/jansson-2.11.tar.bz2
          echo "$SHA256  /tmp/jansson-2.11.tar.bz2" | sha256sum -c -
          tar xjf /tmp/jansson-2.11.tar.bz2 -C /tmp
          cp -a /tmp/jansson-2.11/. build/ps4-check/jansson/

      - name: Check de compilacao
        shell: bash
        run: |
          set -o pipefail
          make -k -f Makefile.ps4-check OPENORBIS="$OPENORBIS" LIBCXX_INCLUDE="$LIBCXX_INCLUDE" 2>&1 | tee check.log

      - name: Teste random_string (host)
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          gcc -Iextern/libpeer/src -Iextern/libpeer/third_party/mbedtls/include \
            -o /tmp/random_string_test tests/host/random_string.c extern/libpeer/src/utils.c
          /tmp/random_string_test

      - name: Check de link (simbolos ausentes)
        shell: bash
        run: |
          set -o pipefail
          command -v ld.lld
          make -k -f Makefile.ps4-check OPENORBIS="$OPENORBIS" LIBCXX_INCLUDE="$LIBCXX_INCLUDE" link 2>&1 | tee link.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-log
          path: |
            check.log
            link.log
